name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Not read by any step: referencing the secret makes GitHub mask the project
  # number, which appears in Cloud Run URLs, Firebase app IDs and gcloud output.
  PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
  REGION: europe-west1
  SERVICE_NAME: skillhive-api
  AR_REPOSITORY: skillhive
  IMAGE_NAME: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/skillhive/api

jobs:
  deploy-backend:
    name: Deploy Go API to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          # Build with commit SHA tag
          BUILD_ID=$(gcloud builds submit backend \
            --tag ${IMAGE_NAME}:${{ github.sha }} \
            --async --format='value(id)' --quiet)
          echo "Waiting for build ${BUILD_ID}..."
          while true; do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --format='value(status)' --quiet 2>/dev/null || echo "UNKNOWN")
            echo "  Build status: ${STATUS}"
            if [ "${STATUS}" = "SUCCESS" ]; then
              echo "Build completed successfully"
              break
            elif [ "${STATUS}" = "FAILURE" ] || [ "${STATUS}" = "INTERNAL_ERROR" ] || [ "${STATUS}" = "TIMEOUT" ] || [ "${STATUS}" = "CANCELLED" ]; then
              echo "Build failed with status: ${STATUS}"
              exit 1
            fi
            sleep 10
          done

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          # Deploy using the commit SHA tag (immutable, reliable)
          gcloud run deploy ${SERVICE_NAME} \
            --image ${IMAGE_NAME}:${{ github.sha }} \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT=${PROJECT_ID},ENV=production,GEMINI_MODEL=gemini-2.5-flash" \
            --set-secrets "CORS_ALLOWED_ORIGINS=skillhive-cors-origins:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest" \
            --quiet
          
          URL=$(gcloud run services describe ${SERVICE_NAME} --region ${REGION} --format='value(status.url)')
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          curl -sf "${{ steps.deploy.outputs.url }}/health" || echo "Health check pending..."

  deploy-firestore:
    name: Deploy Firestore Rules & Indexes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules and indexes
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project ${PROJECT_ID}

  deploy-frontend:
    name: Deploy Vue App to Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch secrets from Secret Manager
        id: secrets
        run: |
          # Mask each value before it reaches GITHUB_ENV; later steps print their env.
          fetch() {
            local value
            value=$(gcloud secrets versions access latest --secret="$2") || value=""
            if [ -n "$value" ]; then echo "::add-mask::${value}"; fi
            echo "$1=${value}" >> "$GITHUB_ENV"
          }
          fetch VITE_API_URL skillhive-api-url
          fetch VITE_FIREBASE_API_KEY skillhive-firebase-api-key
          fetch VITE_FIREBASE_AUTH_DOMAIN skillhive-firebase-auth-domain
          fetch VITE_FIREBASE_PROJECT_ID skillhive-firebase-project-id
          fetch VITE_FIREBASE_STORAGE_BUCKET skillhive-firebase-storage-bucket
          fetch VITE_FIREBASE_MESSAGING_SENDER_ID skillhive-firebase-messaging-sender-id
          fetch VITE_FIREBASE_APP_ID skillhive-firebase-app-id
          fetch VITE_LEGAL_NAME skillhive-legal-name
          fetch VITE_LEGAL_ADDRESS skillhive-legal-address
          fetch VITE_LEGAL_EMAIL skillhive-legal-email

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project ${PROJECT_ID}
