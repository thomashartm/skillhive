# SkillHive Secrets Configuration
# Copy this file to secrets.yaml and fill in your values
# This file is for reference only - actual secrets are stored in Secret Manager

# Backend (Cloud Run)
cors_origins: "https://skillhive.thartm.net,https://REDACTED_PROJECT_ID.web.app,http://localhost:5173"

# API URL (used by frontend)
api_url: "https://skillhive.thartm.net"

# Firebase Configuration
# Get these values from: https://console.firebase.google.com/project/REDACTED_PROJECT_ID/settings/general
firebase:
  api_key: ""           # Web API Key
  auth_domain: "REDACTED_PROJECT_ID.firebaseapp.com"
  project_id: "REDACTED_PROJECT_ID"
  storage_bucket: "REDACTED_PROJECT_ID.appspot.com"
  messaging_sender_id: "REDACTED_PROJECT_NUMBER"  # Same as project number
  app_id: ""            # From Firebase console (starts with 1:...)

# Notes:
# - The api_key is NOT a secret - it's embedded in the frontend JavaScript
# - It's stored in Secret Manager for convenience, not security
# - The actual security comes from Firebase Security Rules and Auth
